name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile main.py modules/*.py
      - name: Run main script
        run: python main.py
      - name: Validate YAML data file
        run: python -c "import yaml, pathlib; pathlib.Path('core/EVOLUMIX_FOUNDATION_v1.yaml').read_text(encoding='utf-8'); yaml.safe_load(open('core/EVOLUMIX_FOUNDATION_v1.yaml', 'r', encoding='utf-8'))"
